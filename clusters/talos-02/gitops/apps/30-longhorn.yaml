apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.7.2
    helm:
      releaseName: longhorn
      values: |
        # Argo CD runs Helm pre-upgrade hooks as PreSync before other resources exist.
        preUpgradeChecker:
          jobEnabled: false
        defaultSettings:
          createDefaultDiskLabeledNodes: true
          # Must match worker disk mount (Talos): first Longhorn disk → /var/lib/longhorn
          defaultDataPath: /var/lib/longhorn
          defaultDataLocality: best-effort
          # Capacity model (dedicated 100 GiB data disk per worker, nothing else on it):
          # - reserved 10% (was the 30% default): the 30% default suits disks shared with the OS;
          #   here it only blocked replica rebuilds (no node could host a 50Gi replica).
          #   Applies to NEW default disks only; existing disks: patch spec.disks.*.storageReserved.
          # - over-provisioning 100%: sum of nominal volume sizes never exceeds disk - reserve,
          #   so every volume can always grow to its full size.
          # - minimal available 15%: stop scheduling replicas when real free space < 15 GiB;
          #   leaves room for snapshots (backup retain) on top of nominal sizes.
          storageReservedPercentageForDefaultDisk: 10
          storageOverProvisioningPercentage: 100
          storageMinimalAvailablePercentage: 15
          # MinIO bucket, per-cluster prefix (s3://<bucket>@<region>/<cluster>/).
          # Credentials: Secret longhorn-backup-minio (Doppler, see gitops/doppler/).
          backupTarget: s3://longhorn-backups@us-east-1/talos-02/
          backupTargetCredentialSecret: longhorn-backup-minio
          replicaSoftAntiAffinity: false
          # Align with the StorageClass (persistence.defaultClassReplicaCount).
          defaultReplicaCount: 2
        persistence:
          defaultClass: true
          defaultClassReplicaCount: 2
          reclaimPolicy: Delete
        ingress:
          enabled: false
        csi:
          kubeletRootDir: /var/lib/kubelet
        longhornManager:
          tolerations: []
        longhornDriver:
          tolerations: []
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Longhorn met à jour les CRD après install (schéma / conversion).
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec

# Created before Doppler-managed secrets and external-dns Helm releases.
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
# MCP servers (Kubernetes, ArgoCD, Grafana) consumed by opencode.
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
---
# node-exporter (hostNetwork, hostPath) + composants observabilité sur Talos PSS.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
# Longhorn manager requires hostPath, privileged containers, and host mounts.
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

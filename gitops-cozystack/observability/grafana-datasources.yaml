# Tempo is the only datasource Cozystack does not provide: logs (vlogs-generic) and
# metrics (vm-shortterm, vm-longterm) already exist as GrafanaDatasource in tenant-root.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
  namespace: tenant-root
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  resyncPeriod: 5m
  datasource:
    name: tempo
    type: tempo
    access: proxy
    url: http://tempo.tenant-root.svc:3200
    jsonData:
      httpMethod: GET

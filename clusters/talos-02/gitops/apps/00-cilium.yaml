apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: platform
  source:
    repoURL: https://helm.cilium.io
    chart: cilium
    targetRevision: 1.16.4
    helm:
      releaseName: cilium
      values: |
        # KubePrism (Talos node-local API load balancer, enabled by default):
        # survives the loss of any single control-plane node.
        k8sServiceHost: localhost
        k8sServicePort: "7445"
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
        ipam:
          mode: kubernetes
        kubeProxyReplacement: true
        cgroup:
          autoMount:
            enabled: false
          hostRoot: /sys/fs/cgroup
        securityContext:
          capabilities:
            ciliumAgent:
              - CHOWN
              - KILL
              - NET_ADMIN
              - NET_RAW
              - IPC_LOCK
              - SYS_ADMIN
              - SYS_RESOURCE
              - DAC_OVERRIDE
              - FOWNER
              - SETGID
              - SETUID
            cleanCiliumState:
              - NET_ADMIN
              - SYS_ADMIN
              - SYS_RESOURCE
        hubble:
          enabled: true
          relay:
            enabled: true
          ui:
            enabled: false
          # certgen Job/CronJob instead of Helm-generated certs: stable manifests
          # (no drift on every render) and periodic rotation.
          tls:
            auto:
              method: cronJob
        certgen:
          annotations:
            job:
              argocd.argoproj.io/hook-delete-policy: HookSucceeded
        envoy:
          updateStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 1
        operator:
          replicas: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: DaemonSet
      jsonPointers:
        - /spec/template/spec/initContainers

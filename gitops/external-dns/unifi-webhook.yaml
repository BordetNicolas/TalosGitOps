apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-unifi-webhook
  namespace: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns-unifi-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns-unifi-webhook
    spec:
      containers:
        - name: webhook
          # UniFi webhook with API key support (UNIFI_API_KEY).
          image: ghcr.io/kashalls/external-dns-unifi-webhook:v0.8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
              name: http
          envFrom:
            - secretRef:
                name: external-dns-unifi-webhook-env
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: external-dns-unifi-webhook
  namespace: external-dns
spec:
  selector:
    app.kubernetes.io/name: external-dns-unifi-webhook
  ports:
    - name: http
      port: 8888
      targetPort: http

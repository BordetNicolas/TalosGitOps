apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoria-logs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    chart: victoria-logs-single
    targetRevision: 0.13.12
    helm:
      releaseName: victoria-logs-single
      values: |
        server:
          persistentVolume:
            enabled: true
            storageClassName: replicated
            size: 50Gi
          retentionPeriod: "30d"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 2Gi
          extraArgs:
            envflag.enable: "true"
            envflag.prefix: VM_
            loggerFormat: json
          service:
            type: ClusterIP
            servicePort: 9428
          serviceMonitor:
            enabled: true
            extraLabels:
              prometheus: victoriametrics
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-root
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true

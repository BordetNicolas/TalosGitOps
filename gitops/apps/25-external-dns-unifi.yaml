apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-unifi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.18.0
    helm:
      releaseName: external-dns-unifi
      values: |
        provider:
          name: webhook
        extraArgs:
          - --webhook-provider-url=http://external-dns-unifi-webhook.external-dns.svc.cluster.local:8888
        domainFilters:
          - __UNIFI_DOMAIN__
        txtOwnerId: __CLUSTER__
        txtPrefix: "k8s."
        policy: sync
        sources:
          - ingress
          - service
        triggerLoopOnEvent: true
        interval: 1m
        logLevel: info
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

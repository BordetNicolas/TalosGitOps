  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-service-token
    namespace: doppler-operator-system
  project: "__DOPPLER_PROJECT__"
  config: "__DOPPLER_CONFIG__"
  managedSecret:
    name: mcp-basic-auth
    namespace: mcp
    type: Opaque
  secrets:
    - MCP_BASIC_AUTH
  processors:
    MCP_BASIC_AUTH:
      type: plain
      asName: auth
---
# API token of the ArgoCD local account "mcp" (argocd account generate-token --account mcp).

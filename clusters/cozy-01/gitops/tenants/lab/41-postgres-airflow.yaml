# Metadata database of Airflow (tenant cluster "workflows"). The password of user "airflow" is
# generated by Cozystack in Secret tenant-lab/postgres-airflow-credentials and copied into
# OpenBAO by scripts/cozystack-openbao.sh.
apiVersion: apps.cozystack.io/v1alpha1
kind: Postgres
metadata:
  name: airflow
  namespace: tenant-lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  version: v17
  replicas: 2
  resourcesPreset: t1.small
  size: 10Gi
  storageClass: local
  external: false
  users:
    airflow: {}
  databases:
    airflow:
      roles:
        admin:
          - airflow

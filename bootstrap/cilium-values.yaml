# Cilium values used during the initial Helm install. These MUST stay in sync
# with `gitops/cilium/values.yaml` so that ArgoCD adopts the deployment with
# zero drift on the next reconciliation.
ipam:
  mode: kubernetes

kubeProxyReplacement: true

# KubePrism (Talos node-local API load balancer, enabled by default).
k8sServiceHost: localhost
k8sServicePort: "7445"

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# Talos-specific socket / cgroup paths.
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: false
  tls:
    auto:
      method: cronJob

certgen:
  annotations:
    job:
      argocd.argoproj.io/hook-delete-policy: HookSucceeded

envoy:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1

operator:
  replicas: 1

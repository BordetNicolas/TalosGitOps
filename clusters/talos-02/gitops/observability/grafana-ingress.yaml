# Ingress that exposes the Grafana UI behind ingress-nginx.
# Certificate: cert-manager DNS-01 (letsencrypt-prod).
# DNS: Cloudflare (set=cloudflare) + UniFi LAN (external-dns-unifi mirrors cloudflare).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/set: cloudflare
spec:
  ingressClassName: nginx
  rules:
    - host: grafana-qa.alexetnico.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kube-prometheus-stack-grafana
                port:
                  number: 80
  tls:
    - hosts:
        - grafana-qa.alexetnico.com
      secretName: grafana-tls

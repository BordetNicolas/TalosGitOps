apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 8.3.0
    helm:
      releaseName: argocd
      values: |
        configs:
          cm:
            # Must match the browser URL (ingress host) or login redirects loop.
            url: https://argocd-qa.alexetnico.com
            # Local account used by the ArgoCD MCP server (token stored in Doppler).
            accounts.mcp: apiKey
          rbac:
            policy.csv: |
              g, mcp, role:admin
          repositories:
            # OCI Helm registry (kubernetes-mcp-server chart).
            containers-charts:
              name: containers-charts
              url: ghcr.io/containers/charts
              type: helm
              enableOCI: "true"
          params:
            server.insecure: true
        server:
          service:
            type: ClusterIP
          extraArgs:
            - --insecure
          ingress:
            enabled: false
        dex:
          enabled: false
        notifications:
          enabled: false
        applicationSet:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

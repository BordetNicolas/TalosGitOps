apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Applications métier déployées depuis le repo apps (workloads-root).
  sourceRepos:
    - "https://github.com/BordetNicolas/homelab-apps.git"
    - "https://airflow.apache.org"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    # CreateNamespace=true et manifests Namespace explicites
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true

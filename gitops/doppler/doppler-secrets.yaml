# Shared Doppler service token: Secret/doppler-service-token (apply via make apply-doppler-token).
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: cert-manager-cloudflare-token
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-service-token
    namespace: doppler-operator-system
  project: "__DOPPLER_PROJECT__"
  config: "__DOPPLER_CONFIG__"
  managedSecret:
    name: cloudflare-api-token
    namespace: cert-manager
    type: Opaque
  secrets:
    - CLOUDFLARE_API_TOKEN
  processors:
    CLOUDFLARE_API_TOKEN:
      type: plain
      asName: api-token
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: external-dns-cloudflare-token
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-service-token
    namespace: doppler-operator-system
  project: "__DOPPLER_PROJECT__"
  config: "__DOPPLER_CONFIG__"
  managedSecret:
    name: external-dns-cloudflare
    namespace: external-dns
    type: Opaque
  secrets:
    - CLOUDFLARE_API_TOKEN
  processors:
    CLOUDFLARE_API_TOKEN:
      type: plain
      asName: api-token
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: external-dns-unifi-webhook-env
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-service-token
    namespace: doppler-operator-system
  project: "__DOPPLER_PROJECT__"
  config: "__DOPPLER_CONFIG__"
  managedSecret:
    name: external-dns-unifi-webhook-env
    namespace: external-dns
    type: Opaque
  secrets:
    - UNIFI_HOST
    - UNIFI_API_KEY
    - UNIFI_SITE
    - UNIFI_SKIP_TLS_VERIFY

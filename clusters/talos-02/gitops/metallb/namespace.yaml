# MetalLB speaker requires hostNetwork, hostPorts, and NET_RAW (L2/ARP).
# Baseline Pod Security blocks the speaker DaemonSet.
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged

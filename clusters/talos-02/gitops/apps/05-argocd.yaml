apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: platform
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: 8.3.0
    helm:
      releaseName: argocd
      values: |
        configs:
          params:
            server.insecure: true
        server:
          service:
            type: ClusterIP
          extraArgs:
            - --insecure
          ingress:
            enabled: false
        dex:
          enabled: false
        notifications:
          enabled: false
        applicationSet:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns-unifi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.18.0
    helm:
      releaseName: external-dns-unifi
      values: |
        provider:
          name: webhook
          webhook:
            image:
              repository: ghcr.io/kashalls/external-dns-unifi-webhook
              tag: v0.8.0
            env:
              - name: SERVER_HOST
                value: "0.0.0.0"
              - name: UNIFI_HOST
                valueFrom:
                  secretKeyRef:
                    name: external-dns-unifi-webhook-env
                    key: UNIFI_HOST
              - name: UNIFI_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: external-dns-unifi-credentials
                    key: UNIFI_API_KEY
              - name: UNIFI_SITE
                valueFrom:
                  secretKeyRef:
                    name: external-dns-unifi-credentials
                    key: UNIFI_SITE
              # Not a secret; keep out of Doppler (boolean keys are often missing from synced Secrets).
              - name: UNIFI_SKIP_TLS_VERIFY
                value: "true"
            readinessProbe:
              httpGet:
                path: /readyz
                port: http-webhook
              initialDelaySeconds: 10
              timeoutSeconds: 5
            livenessProbe:
              httpGet:
                path: /healthz
                port: http-webhook
              initialDelaySeconds: 10
              timeoutSeconds: 5
        extraArgs:
          # Publish both UniFi-only and Cloudflare-annotated Ingresses into the
          # local UniFi DNS zone (LAN). Cloudflare instance keeps set=cloudflare only.
          - --annotation-filter=external-dns.alpha.kubernetes.io/set in (cloudflare, unifi)
        domainFilters:
          - alexetnico.com
        txtOwnerId: talos-02-unifi
        txtPrefix: "k8s."
        policy: sync
        sources:
          - ingress
        triggerLoopOnEvent: true
        interval: 1m
        logLevel: info
  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

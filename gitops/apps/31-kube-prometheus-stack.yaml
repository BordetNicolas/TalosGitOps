apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 67.11.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        defaultRules:
          create: true
        alertmanager:
          enabled: true
          # Lists replace the chart defaults (route.routes, receivers); inhibit_rules and
          # templates are kept from the chart.
          config:
            route:
              receiver: telegram
              group_by:
                - namespace
                - alertname
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                # Always-firing alert -> healthchecks.io: no ping = alerting pipeline is down.
                - receiver: healthchecks
                  matchers:
                    - alertname = "Watchdog"
                  group_wait: 0s
                  group_interval: 1m
                  repeat_interval: 5m
                - receiver: "null"
                  matchers:
                    - alertname = "InfoInhibitor"
            receivers:
              - name: "null"
              - name: telegram
                telegram_configs:
                  - bot_token_file: /etc/alertmanager/notifiers/telegram-bot-token
                    chat_id: __TELEGRAM_CHAT_ID__
                    send_resolved: true
              - name: healthchecks
                webhook_configs:
                  - url_file: /etc/alertmanager/notifiers/healthchecks-ping-url
                    send_resolved: false
          alertmanagerSpec:
            # Secret alertmanager-notifiers comes from Doppler (gitops/doppler/). Optional so a
            # missing Doppler key only breaks notifications, not the Alertmanager pod.
            volumes:
              - name: notifiers
                secret:
                  secretName: alertmanager-notifiers
                  optional: true
            volumeMounts:
              - name: notifiers
                mountPath: /etc/alertmanager/notifiers
                readOnly: true
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 256Mi
        grafana:
          enabled: true
          defaultDashboardsEnabled: true
          admin:
            existingSecret: grafana-admin-credentials
            userKey: admin-user
            passwordKey: admin-password
          ingress:
            enabled: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              jsonData:
                maxLines: 1000
            - name: Tempo
              uid: tempo
              type: tempo
              access: proxy
              url: http://tempo.monitoring.svc.cluster.local:3200
              jsonData:
                httpMethod: GET
                tracesToLogs:
                  datasourceUid: loki
                  filterByTraceID: true
                  filterBySpanID: false
        # Talos control-plane components (bind addresses: talos/patches/controlplane-cluster.yaml).
        # kube-proxy is replaced by Cilium.
        kubeProxy:
          enabled: false
        # etcd is a Talos service, not a pod: the chart's selector-based Service finds nothing,
        # so nodes are scraped directly (job kube-etcd below). Kept enabled for rules/dashboard.
        kubeEtcd:
          enabled: true
          service:
            enabled: false
          serviceMonitor:
            enabled: false
        prometheus:
          prometheusSpec:
            additionalScrapeConfigs:
              - job_name: kube-etcd
                kubernetes_sd_configs:
                  - role: node
                relabel_configs:
                  - source_labels: [__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane]
                    regex: "true"
                    action: keep
                  - source_labels: [__address__]
                    regex: ([^:]+)(?::\d+)?
                    replacement: $1:2381
                    target_label: __address__
                  - source_labels: [__meta_kubernetes_node_name]
                    target_label: node
            retention: 15d
            # ~7.8k samples/s -> ~18 GB for 15d (blocks + WAL). retentionSize caps the TSDB
            # below the 30Gi PVC if ingestion grows (oldest blocks dropped first).
            retentionSize: 25GB
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 2Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: longhorn
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 30Gi
        prometheusOperator:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
        kube-state-metrics:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
        prometheus-node-exporter:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

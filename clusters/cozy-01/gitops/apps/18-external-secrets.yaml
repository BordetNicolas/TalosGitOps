# External Secrets Operator in the tenant Kubernetes cluster "workflows": syncs OpenBAO
# (Cozystack app tenant-lab/openbao-lab) into Kubernetes Secrets. Destination "workflows-lab" is
# registered by scripts/cozystack-register-tenant-cluster.sh.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: lab
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.15.0
    helm:
      releaseName: external-secrets
      values: |
        installCRDs: true
  destination:
    name: workflows-lab
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

# WorkflowTemplates of the WorkflowsArgo repo, same source as talos-02. Its artifact-repositories
# ConfigMap points at an external MinIO, so it is excluded: the ConfigMap (same name/key) and the
# Secret s3-artifacts are applied at runtime from the tenant-lab Bucket by
# scripts/cozystack-workflows-secrets.sh (make cozystack-workflows-secrets).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workflows-argo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: lab
  source:
    repoURL: https://github.com/BordetNicolas/WorkflowsArgo.git
    targetRevision: main
    path: manifests
    directory:
      exclude: artifact-repositories.yaml
  destination:
    name: workflows-lab
    namespace: workflows-argo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

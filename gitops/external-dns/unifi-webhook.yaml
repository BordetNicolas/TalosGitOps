apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns-unifi-webhook
  namespace: external-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns-unifi-webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns-unifi-webhook
    spec:
      containers:
        - name: webhook
          # v0.8+: webhook API on :8888, health/ready on :8080 (see upstream README).
          image: ghcr.io/kashalls/external-dns-unifi-webhook:v0.8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVER_HOST
              value: "0.0.0.0"
          envFrom:
            - secretRef:
                name: external-dns-unifi-webhook-env
          ports:
            - containerPort: 8888
              name: http
            - containerPort: 8080
              name: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: external-dns-unifi-webhook
  namespace: external-dns
spec:
  selector:
    app.kubernetes.io/name: external-dns-unifi-webhook
  ports:
    - name: http
      port: 8888
      targetPort: http

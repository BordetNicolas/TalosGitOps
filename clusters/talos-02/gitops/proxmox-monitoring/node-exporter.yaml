# node_exporter running on the Proxmox host itself (apt install prometheus-node-exporter, port 9100):
# real filesystems, disk I/O, CPU, memory, network, temperatures of the physical machine.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: pve-node-exporter
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  jobName: pve-node-exporter
  scrapeInterval: 30s
  staticConfigs:
    - targets:
        - 192.168.2.33:9100
      labels:
        host: pve

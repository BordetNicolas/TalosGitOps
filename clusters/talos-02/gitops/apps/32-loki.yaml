apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 7.0.0
    helm:
      releaseName: loki
      values: |
        deploymentMode: SingleBinary
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          # Retention: compactor deletes chunks older than retention_period (~65 MB/day stored).
          compactor:
            working_directory: /var/loki/compactor
            retention_enabled: true
            retention_delete_delay: 2h
            delete_request_store: filesystem
          limits_config:
            retention_period: 30d
          schemaConfig:
            configs:
              - from: "2024-04-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: loki_index_
                  period: 24h
        singleBinary:
          replicas: 1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          persistence:
            enabled: true
            storageClass: longhorn
            size: 30Gi
            # Chart default is Delete: deleting/scaling the StatefulSet would delete the data.
            whenDeleted: Retain
            whenScaled: Retain
        # Memcached caches (defaults: chunks 8Gi) — disable on homelab SingleBinary;
        # workers ~8Gi RAM cannot schedule loki-chunks-cache-0.
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        gateway:
          enabled: false
        read:
          replicas: 0
        write:
          replicas: 0
        backend:
          replicas: 0
        monitoring:
          serviceMonitor:
            enabled: true
            labels:
              release: kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # SSA + Helm : le champ status peut apparaître dans volumeClaimTemplates côté live.
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.status
    # Champs par défaut injectés par l'API Kubernetes après création.
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/updateStrategy/type

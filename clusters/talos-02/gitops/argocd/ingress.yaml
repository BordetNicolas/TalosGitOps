# Ingress that exposes the ArgoCD UI behind ingress-nginx.
# Certificate is managed automatically by cert-manager (DNS-01 with Cloudflare,
# ClusterIssuer `letsencrypt-prod`).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/set: cloudflare
spec:
  ingressClassName: nginx
  rules:
    - host: argocd-test.alexetnico.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
  tls:
    - hosts:
        - argocd-test.alexetnico.com
      secretName: argocd-server-tls

# Ingress that exposes the ArgoCD UI behind ingress-nginx.
# Certificate: cert-manager DNS-01 (letsencrypt-prod).
# DNS: Cloudflare (set=cloudflare) + UniFi LAN (external-dns-unifi mirrors cloudflare).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # ArgoCD auth cookies/JWT can exceed default nginx buffer size.
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/set: cloudflare
spec:
  ingressClassName: nginx
  rules:
    - host: argocd-qa.alexetnico.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
  tls:
    - hosts:
        - argocd-qa.alexetnico.com
      secretName: argocd-server-tls

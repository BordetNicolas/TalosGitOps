# OpenBAO of the tenant (Cozystack app openbao-lab), KV v2 mounted at "secret/". Authentication:
# Kubernetes auth method; OpenBAO validates the ServiceAccount token of the operator against the
# API of this cluster (configured by scripts/cozystack-openbao.sh, role "external-secrets").
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  provider:
    vault:
      server: http://openbao-openbao-lab.tenant-lab.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      releaseName: ingress-nginx
      values: |
        controller:
          kind: Deployment
          replicaCount: 2
          ingressClassResource:
            default: true
          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
          allowSnippetAnnotations: false
          # Default true: a terminating leader clears Ingress .status, and external-dns
          # (policy sync) then deletes the public DNS records until a new leader republishes.
          extraArgs:
            update-status-on-shutdown: "false"
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              additionalLabels:
                release: kube-prometheus-stack
          config:
            use-forwarded-headers: "true"
            ssl-redirect: "true"
        defaultBackend:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

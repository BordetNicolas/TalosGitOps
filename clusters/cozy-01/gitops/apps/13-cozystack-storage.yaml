# LINSTOR StorageClasses (local = default, replicated). The ZFS pools themselves are created by
# scripts/cozystack-storage.sh (make cozystack-storage) — see docs/cozystack.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cozystack-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  source:
    repoURL: https://github.com/BordetNicolas/TalosGitOps.git
    targetRevision: feat/cozy-01
    path: clusters/cozy-01/gitops/cozystack-storage
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

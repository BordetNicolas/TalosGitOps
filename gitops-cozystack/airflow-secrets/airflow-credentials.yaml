# Secret airflow-credentials <- OpenBAO secret/airflow/app. Every key of the OpenBAO secret becomes
# a key of the Kubernetes Secret: fernet-key, api-secret-key, jwt-secret, admin-password, connection.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-credentials
  namespace: airflow
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: airflow-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: airflow/app
---
# Secret airflow-s3-logs <- OpenBAO secret/airflow/logs: the remote logging settings and
# the S3 connection, injected as environment variables (extraEnvFrom in the chart values).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-s3-logs
  namespace: airflow
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: airflow-s3-logs
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: airflow/logs

# Worker pool of the "workflows" cluster. Must be named <cluster>-<pool>. The ingress-nginx role
# is required by addons.ingressNginx in 30-kubernetes-workflows.yaml.
apiVersion: apps.cozystack.io/v1alpha1
kind: KubernetesNodes
metadata:
  name: workflows-main
  namespace: tenant-lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  cluster: workflows
  version: v1.35
  storageClass: replicated
  instanceType: u1.medium
  diskSize: 20Gi
  minReplicas: 2
  maxReplicas: 2
  roles:
    - ingress-nginx

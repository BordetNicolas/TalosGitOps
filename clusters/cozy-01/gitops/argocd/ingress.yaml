# ArgoCD UI behind the root tenant ingress-nginx (IngressClass "tenant-root").
# Certificate: Cozystack's letsencrypt-prod ClusterIssuer (DNS-01, see Platform Package).
# DNS: record argocd.<root host> created by tofu/unifi.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: tenant-root
  rules:
    - host: argocd.cozy-01.alexetnico.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
  tls:
    - hosts:
        - argocd.cozy-01.alexetnico.com
      secretName: argocd-server-tls

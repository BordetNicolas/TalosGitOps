# Shared Doppler service token: Secret/doppler-service-token (apply via make apply-doppler-token).
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: cert-manager-cloudflare-token
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-service-token
    namespace: doppler-operator-system
  project: "k8s-talos-pve1"
  config: "prd"
  managedSecret:
    name: cloudflare-api-token
    namespace: cert-manager
    type: Opaque
  secrets:
    - CLOUDFLARE_API_TOKEN
  processors:
    CLOUDFLARE_API_TOKEN:
      type: plain
      asName: api-token
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: external-dns-cloudflare-token
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-service-token
    namespace: doppler-operator-system
  project: "k8s-talos-pve1"
  config: "prd"
  managedSecret:
    name: external-dns-cloudflare
    namespace: external-dns
    type: Opaque
  secrets:
    - CLOUDFLARE_API_TOKEN
  processors:
    CLOUDFLARE_API_TOKEN:
      type: plain
      asName: api-token
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: external-dns-unifi-webhook-env
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-service-token
    namespace: doppler-operator-system
  project: "k8s-talos-pve1"
  config: "prd"
  managedSecret:
    name: external-dns-unifi-credentials
    namespace: external-dns
    type: Opaque
  secrets:
    - UNIFI_API_KEY
    - UNIFI_SITE
---
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: grafana-admin-credentials
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-service-token
    namespace: doppler-operator-system
  project: "k8s-talos-pve1"
  config: "prd"
  managedSecret:
    name: grafana-admin-credentials
    namespace: monitoring
    type: Opaque
  secrets:
    - GRAFANA_ADMIN_USER
    - GRAFANA_ADMIN_PASSWORD
  processors:
    GRAFANA_ADMIN_USER:
      type: plain
      asName: admin-user
    GRAFANA_ADMIN_PASSWORD:
      type: plain
      asName: admin-password

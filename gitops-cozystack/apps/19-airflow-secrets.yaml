# ClusterSecretStore (OpenBAO) + ExternalSecrets of Airflow. SkipDryRunOnMissingResource: the
# External Secrets CRDs are installed by the external-secrets Application (wave 5).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: lab
  source:
    repoURL: __ARGOCD_GIT_REPO__
    targetRevision: __ARGOCD_GIT_REVISION__
    path: gitops/airflow-secrets
    directory:
      recurse: false
  destination:
    name: workflows-lab
    namespace: airflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

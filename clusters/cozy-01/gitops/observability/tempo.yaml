apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tempo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
    # With ServerSideApply, the default diff predicts creationTimestamp: null in the StatefulSet
    # volumeClaimTemplates and never converges: let the API server compute the diff.
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: platform
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.24.4
    helm:
      releaseName: tempo
      values: |
        tempo:
          reportingEnabled: false
          retention: 168h  # 7 jours
          metricsGenerator:
            enabled: true
            remoteWriteUrl: http://vminsert-shortterm.tenant-root.svc:8480/insert/0/prometheus/api/v1/write
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
        persistence:
          enabled: true
          storageClassName: local
          size: 10Gi
        serviceMonitor:
          enabled: true
          additionalLabels:
            prometheus: victoriametrics
        service:
          type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-root
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.status

apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: ubuntu-root
  namespace: tenant-lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  source:
    http:
      url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
  storage: 20Gi
  storageClass: replicated
  optical: false
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: ubuntu
  namespace: tenant-lab
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  disks:
    - name: ubuntu-root
  instanceType: u1.medium
  instanceProfile: ubuntu
  runStrategy: Always
  external: true
  externalMethod: PortList
  externalPorts:
    - 22
  sshKeys:
    - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICrIiWNZEAPxRG744Bx3uJleYkbTSdr+1AqleMNowUDc github@bordetnico.com"

# ArgoCD MCP server + MCP ingresses (LAN only, basic auth) + NetworkPolicy.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mcp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: platform
  source:
    repoURL: https://github.com/BordetNicolas/TalosGitOps.git
    targetRevision: main
    path: clusters/talos-02/gitops/mcp
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: mcp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

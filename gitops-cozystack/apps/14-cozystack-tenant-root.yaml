# Root tenant services (ingress, monitoring, etcd, seaweedfs). The Tenant "root" is created by the platform;
# this only declares the spec fields we want (server-side apply merges them).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cozystack-tenant-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  source:
    repoURL: __ARGOCD_GIT_REPO__
    targetRevision: __ARGOCD_GIT_REVISION__
    path: gitops/cozystack-tenant
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: tenant-root
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 30
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m

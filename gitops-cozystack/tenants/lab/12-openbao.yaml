# Static seal = auto-unseal after a restart (key in Secret tenant-lab/openbao-unseal, created by
# scripts/cozystack-openbao.sh, never committed). The pods wait for that Secret to exist.
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  name: openbao-lab
  namespace: tenant-lab
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  resourcesPreset: t1.small
  size: 10Gi
  storageClass: local
  external: false
  ui: true
  seal:
    type: static
    secretName: openbao-unseal
    keyId: key-1

---
# Longhorn backup target credentials (MinIO, S3 API). Prefer a dedicated MinIO user
# restricted to the backup bucket. LONGHORN_BACKUP_AWS_ENDPOINTS = MinIO URL (https://host:port).
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: longhorn-backup-minio
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-service-token
    namespace: doppler-operator-system
  project: "__DOPPLER_PROJECT__"
  config: "__DOPPLER_CONFIG__"
  managedSecret:
    name: longhorn-backup-minio
    namespace: longhorn-system
    type: Opaque
  secrets:
    - LONGHORN_BACKUP_AWS_ACCESS_KEY_ID
    - LONGHORN_BACKUP_AWS_SECRET_ACCESS_KEY
    - LONGHORN_BACKUP_AWS_ENDPOINTS
  processors:
    LONGHORN_BACKUP_AWS_ACCESS_KEY_ID:
      type: plain
      asName: AWS_ACCESS_KEY_ID
    LONGHORN_BACKUP_AWS_SECRET_ACCESS_KEY:
      type: plain
      asName: AWS_SECRET_ACCESS_KEY
    LONGHORN_BACKUP_AWS_ENDPOINTS:
      type: plain
      asName: AWS_ENDPOINTS

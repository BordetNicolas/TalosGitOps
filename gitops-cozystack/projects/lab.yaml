apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: lab
  namespace: argocd
spec:
  description: Workloads deployed in the tenant Kubernetes cluster "workflows" (tenant lab).
  sourceRepos:
    - "__ARGOCD_GIT_REPO__"
    - "https://argoproj.github.io/argo-helm"
    - "https://github.com/BordetNicolas/WorkflowsArgo.git"
  destinations:
    - name: workflows-lab
      namespace: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

machine:
  nodeLabels:
    node.longhorn.io/create-default-disk: config
  disks:
    - device: /dev/disk/by-id/scsi-0QEMU_QEMU_HARDDISK_drive-scsi1
      partitions:
        - mountpoint: /var/mnt/longhorn-0
  kubelet:
    extraMounts:
      - destination: /var/mnt/longhorn-0
        type: bind
        source: /var/mnt/longhorn-0
        options:
          - bind
          - rshared
          - rw
  udev:
    rules:
      - 'SUBSYSTEM=="block", ENV{ID_SERIAL}=="?*longhorn-0*", SYMLINK+="longhorn/longhorn-0"'

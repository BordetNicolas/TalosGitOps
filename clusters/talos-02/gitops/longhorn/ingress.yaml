# Ingress that exposes the Longhorn UI behind ingress-nginx.
# Certificate: cert-manager DNS-01 (letsencrypt-prod).
# DNS: Cloudflare (set=cloudflare) + UniFi LAN (external-dns-unifi mirrors cloudflare).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-frontend
  namespace: longhorn-system
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/set: cloudflare
spec:
  ingressClassName: nginx
  rules:
    - host: longhorn-qa.alexetnico.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: longhorn-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - longhorn-qa.alexetnico.com
      secretName: longhorn-frontend-tls
